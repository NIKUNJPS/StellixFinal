name: Deploy

# On every push to main: build + push both images to GHCR, deploy to staging
# automatically, then deploy to production ONLY after a manual approval.
#
# The manual production gate is a GitHub *Environment* protection rule: in
# Settings → Environments → "production", add required reviewers. The
# `environment: production` on the deploy-production job below makes the run pause
# for their approval before it proceeds. No extra step is needed in this file.
on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stellix-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/stellix-frontend

jobs:
  # ---- Build & push both images to GHCR (no external account needed) ---------
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # NEXT_PUBLIC_* is inlined at build time. If staging and production use
          # different API origins, promote via separate builds instead of reusing
          # this image (documented in docs/adr/ADR-FINAL.md).
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.stellixlabs.example' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---- Auto-deploy to staging -----------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://app.staging.stellixlabs.example
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
      - name: Deploy
        run: bash .github/scripts/k8s-deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}

  # ---- Manual-approval production deploy ------------------------------------
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production   # required reviewers on this environment gate the run
      url: https://app.stellixlabs.example
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"
      - name: Deploy
        run: bash .github/scripts/k8s-deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}

# Auto-provisions every dashboard JSON in infra/grafana/dashboards/ on startup.
apiVersion: 1

providers:
  - name: "Stellix Labs"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

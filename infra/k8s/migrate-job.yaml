# One-shot Alembic migration Job — Batch 17.
# Run (and wait for) this BEFORE rolling out a new backend version, so schema
# changes land before the new code serves traffic. The CD pipeline does:
#   kubectl delete job stellix-migrate -n stellix --ignore-not-found
#   kubectl apply -f infra/k8s/migrate-job.yaml
#   kubectl wait --for=condition=complete job/stellix-migrate -n stellix --timeout=300s
# Alembic uses the SYNC URL (psycopg); both URLs live in the Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: stellix-migrate
  namespace: stellix
  labels:
    app.kubernetes.io/name: stellix-migrate
    app.kubernetes.io/part-of: stellix-labs
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellix-migrate
        app.kubernetes.io/part-of: stellix-labs
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/stellix-labs/stellix-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: stellix-config
            - secretRef:
                name: stellix-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

# Frontend (Next.js standalone server) — Batch 17.
# NEXT_PUBLIC_* values are inlined at image BUILD time (see frontend/Dockerfile
# build-arg), so the runtime env here is intentionally minimal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellix-frontend
  namespace: stellix
  labels:
    app.kubernetes.io/name: stellix-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: stellix-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stellix-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellix-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: stellix-labs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/stellix-labs/stellix-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Next writes its runtime cache here; keep the rest of the FS read-only.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

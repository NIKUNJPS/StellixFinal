# ClusterIP Services for the API and web tiers (Ingress terminates external
# traffic and routes to these) — Batch 17.
apiVersion: v1
kind: Service
metadata:
  name: stellix-backend
  namespace: stellix
  labels:
    app.kubernetes.io/name: stellix-backend
    app.kubernetes.io/part-of: stellix-labs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellix-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: stellix-frontend
  namespace: stellix
  labels:
    app.kubernetes.io/name: stellix-frontend
    app.kubernetes.io/part-of: stellix-labs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellix-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

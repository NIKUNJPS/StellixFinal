# Non-secret application configuration (Batch 17).
# Every key here is safe to commit — see secret.example.yaml for the values that
# must NOT be. Field names match backend/app/core/config.py exactly (12-factor);
# the backend + Celery Deployments load these via `envFrom.configMapRef`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stellix-config
  namespace: stellix
  labels:
    app.kubernetes.io/part-of: stellix-labs
data:
  # ---- Application ----------------------------------------------------------
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PROJECT_NAME: "Stellix Labs"
  API_V1_PREFIX: "/api/v1"
  # Real frontend origin(s), comma-separated. Must NOT be "*" in production
  # (config.py fails fast at startup if it is).
  BACKEND_CORS_ORIGINS: "https://app.stellixlabs.example"

  # ---- Auth / JWT (non-secret knobs; JWT_SECRET_KEY is in the Secret) -------
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  MAX_FAILED_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_MINUTES: "15"
  AUTH_RATE_LIMIT_TIMES: "5"
  AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"

  # ---- Data ingestion / feature engineering ---------------------------------
  DATA_NAN_TOLERANCE: "0.05"
  DATA_GAP_INTERVAL_MULTIPLIER: "3"

  # ---- Regime detection ensemble --------------------------------------------
  REGIME_MIN_PERIODS: "60"
  REGIME_CRISIS_PERCENTILE: "95.0"
  REGIME_HIGH_VOL_PERCENTILE: "60.0"
  REGIME_WEIGHT_WINDOW: "50"
  REGIME_PELT_PEN_SCALE: "3.0"
  REGIME_RANDOM_STATE: "42"

  # ---- Validation engine ----------------------------------------------------
  VALIDATION_WALK_FORWARD_FOLDS: "5"
  VALIDATION_MONTE_CARLO_SIMS: "1000"
  VALIDATION_PERSISTENCE_ALPHA: "0.05"
  VALIDATION_RANDOM_SEED: "42"
  DEFAULT_RISK_TOLERANCE_MAX_DD_PCT: "30.0"

  # ---- LLM research assistant (model id; the API key is in the Secret) ------
  ANTHROPIC_MODEL: "claude-sonnet-4-6"

  # ---- Local-disk artifact stores (back with a PVC or object storage) -------
  COMPLIANCE_EXPORT_DIR: "var/compliance_exports"
  AVATAR_UPLOAD_DIR: "var/avatars"

  # ---- Observability --------------------------------------------------------
  SENTRY_TRACES_SAMPLE_RATE: "0.1"

  # ---- Billing redirect base + cookies --------------------------------------
  FRONTEND_URL: "https://app.stellixlabs.example"
  REFRESH_COOKIE_NAME: "stellix_refresh"
  # MUST be true in production — the refresh cookie is only sent over HTTPS.
  REFRESH_COOKIE_SECURE: "true"
  REFRESH_COOKIE_SAMESITE: "lax"

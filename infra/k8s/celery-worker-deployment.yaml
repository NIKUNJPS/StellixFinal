# Celery worker — Batch 17.
# SAME image as the backend; only the command differs (runs the worker instead of
# uvicorn). This is where every >2s job actually executes — regime detection, the
# 5-method validation suite, GA evolution, backtests, compliance exports — so it is
# scaled independently of the API (HPA below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellix-celery-worker
  namespace: stellix
  labels:
    app.kubernetes.io/name: stellix-celery-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: stellix-labs
spec:
  replicas: 1  # baseline; the HPA below scales 1→3
  selector:
    matchLabels:
      app.kubernetes.io/name: stellix-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellix-celery-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: stellix-labs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Give in-flight tasks time to finish on rollout/scale-down before SIGKILL
      # (Celery does a warm shutdown on SIGTERM). See docs/disaster_recovery.md.
      terminationGracePeriodSeconds: 120
      containers:
        - name: celery-worker
          image: ghcr.io/stellix-labs/stellix-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.worker.celery_app.celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: stellix-config
            - secretRef:
                name: stellix-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # No HTTP port → no httpGet probe. `celery inspect ping` against THIS
          # pod's own worker node (celery@$HOSTNAME) is the liveness signal.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A app.worker.celery_app.celery_app inspect ping -d "celery@$HOSTNAME" --timeout 10
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: var
              mountPath: /app/var
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: var
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# HPA: 1→3 workers. CPU is used as the out-of-the-box proxy for load (a GA or
# validation run pins CPU well above the 500m request, so utilization crosses the
# threshold and adds a worker). The *ideal* signal is broker queue depth; wire that
# up with KEDA or the Prometheus adapter — see the commented block below.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stellix-celery-worker
  namespace: stellix
  labels:
    app.kubernetes.io/part-of: stellix-labs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stellix-celery-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # Don't yank a worker the instant load drops — a burst of validation jobs
      # is spiky; wait 5 min of calm before scaling in.
      stabilizationWindowSeconds: 300
# ----------------------------------------------------------------------------
# Queue-depth autoscaling (preferred over CPU) — install KEDA and replace the
# HPA above with a ScaledObject like:
#
#   apiVersion: keda.sh/v1alpha1
#   kind: ScaledObject
#   metadata: { name: stellix-celery-worker, namespace: stellix }
#   spec:
#     scaleTargetRef: { name: stellix-celery-worker }
#     minReplicaCount: 1
#     maxReplicaCount: 3
#     triggers:
#       - type: redis
#         metadata:
#           addressFromEnv: CELERY_BROKER_URL
#           listName: celery          # the default Celery queue key in Redis
#           listLength: "10"          # add a worker per ~10 queued tasks
# ----------------------------------------------------------------------------

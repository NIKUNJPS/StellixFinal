# ============================================================================
# SECRET TEMPLATE — fill before deploying, NEVER commit real values.
# ============================================================================
# This file is a *template*. Copy it, replace every REPLACE_ME with a real value,
# and apply it out-of-band (or, better, source these from a real secret manager —
# External Secrets Operator, Sealed Secrets, Vault, or your cloud's Secret Manager —
# rather than a raw Secret object). The committed copy must contain only placeholders.
#
#   cp secret.example.yaml secret.yaml   # secret.yaml is gitignored
#   # edit secret.yaml, then:
#   kubectl apply -f secret.yaml
#
# `stringData` lets you write plaintext; Kubernetes base64-encodes it on apply.
# Field names match backend/app/core/config.py; the backend + Celery Deployments
# load these via `envFrom.secretRef`.
apiVersion: v1
kind: Secret
metadata:
  name: stellix-secrets
  namespace: stellix
  labels:
    app.kubernetes.io/part-of: stellix-labs
type: Opaque
stringData:
  # ---- PostgreSQL (managed cloud instance — see ADR-0004) -------------------
  # Async URL (asyncpg) used by the app; sync URL (psycopg) used by Alembic.
  DATABASE_URL: "postgresql+asyncpg://USER:REPLACE_ME@postgres.managed.example:5432/stellix"
  DATABASE_URL_SYNC: "postgresql+psycopg://USER:REPLACE_ME@postgres.managed.example:5432/stellix"

  # ---- Redis (managed cloud instance — see ADR-0004) ------------------------
  REDIS_URL: "redis://:REPLACE_ME@redis.managed.example:6379/0"
  CELERY_BROKER_URL: "redis://:REPLACE_ME@redis.managed.example:6379/1"
  CELERY_RESULT_BACKEND: "redis://:REPLACE_ME@redis.managed.example:6379/2"

  # ---- Auth ------------------------------------------------------------------
  # Generate: python -c "import secrets; print(secrets.token_urlsafe(48))"
  JWT_SECRET_KEY: "REPLACE_ME"

  # ---- Deferred third-party credentials -------------------------------------
  # Leave as empty strings if not yet configured — the app degrades gracefully
  # (LLM/billing/Sentry/webhooks stay inert) rather than crashing.
  ALPHA_VANTAGE_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  # Real-time ETF streamer (etf-streamer-deployment.yaml). Unset => "not configured".
  ALPACA_API_KEY_ID: ""
  ALPACA_API_SECRET_KEY: ""
  SENTRY_DSN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_PRICE_STARTER: ""
  STRIPE_PRICE_PRO: ""
  DEMO_WEBHOOK_URL: ""

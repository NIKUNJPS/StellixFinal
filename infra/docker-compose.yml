# Stellix Labs — local development stack.
# Every backing service runs in a container from day one (PROJECT_CONSTITUTION §2).
# Bring up with:  docker compose --env-file .env up   (run from the /infra directory)
#
# NOTE: there is no "install postgres locally" path. This file is the only supported
# way to run the data tier in development.

name: stellix-labs

services:
  # --- PostgreSQL 15 + TimescaleDB extension (relational + time-series) ----------
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: stellix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready alone returns ready before the DB accepts real queries; run an
      # actual query so dependents only start once Postgres truly serves traffic.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Redis 7.x (cache, sessions, Celery broker/result backend) -----------------
  redis:
    image: redis:7-alpine
    container_name: stellix-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Prometheus (metrics scrape + alert evaluation) — Batch 13 -----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: stellix-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    # The backend runs natively (uvicorn on the host), not in this compose
    # stack, in every dev environment this project has run in so far — this
    # is how a containerized Prometheus reaches a host-run /metrics endpoint.
    # Docker Desktop (Windows/Mac) resolves host.docker.internal without this
    # entry; host-gateway makes the same name work on Linux hosts too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Grafana (dashboards + built-in alerting) — Batch 13 -----------------------
  grafana:
    image: grafana/grafana-oss:latest
    container_name: stellix-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      # Read by the ${GRAFANA_ALERT_WEBHOOK_URL} expansion in
      # provisioning/alerting/contact-points.yml — unset by default (deferred
      # credential; Grafana just won't have a working contact point yet).
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

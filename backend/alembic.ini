# Alembic configuration for Stellix Labs.
# The database URL is NOT hardcoded here — env.py reads it from settings
# (DATABASE_URL_SYNC), which comes from the environment / infra/.env.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Use a UTC, timestamped, slug-friendly revision filename.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
